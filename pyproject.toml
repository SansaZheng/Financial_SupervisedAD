[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "financial-supervised-ad"
version = "0.1.0"
description = "Ten reproducible supervised baselines for transaction fraud detection"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "pandas>=2,<3", "scikit-learn>=1.7,<1.8", "xgboost>=3.1,<3.2", "joblib>=1.3"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
financial-ad = "financial_supervised_ad.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
